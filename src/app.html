<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#171717" />
		<link rel="icon" href="/favicon.svg" />

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(function() {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage.theme) {
					localStorage.theme = 'system';
				}

				const storedTheme = localStorage.theme;
				const html = document.documentElement;

				// 移除所有主题类
				html.classList.remove('light', 'dark', 'oled-dark', 'system');

				// 重置 CSS 变量
				html.style.removeProperty('--color-gray-800');
				html.style.removeProperty('--color-gray-850');
				html.style.removeProperty('--color-gray-900');
				html.style.removeProperty('--color-gray-950');

				if (storedTheme === 'system') {
					html.classList.add('system');
					metaThemeColorTag.setAttribute('content', '#AEB8C4');
				} else if (storedTheme === 'oled-dark') {
					html.style.setProperty('--color-gray-800', '#101010');
					html.style.setProperty('--color-gray-850', '#050505');
					html.style.setProperty('--color-gray-900', '#000000');
					html.style.setProperty('--color-gray-950', '#000000');
					html.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (storedTheme === 'light') {
					html.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else {
					html.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				// Listen for system theme changes
				window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							html.classList.add('dark');
							html.classList.remove('light', 'system');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							html.classList.add('light', 'system');
							html.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#AEB8C4');
						}
					}
				});
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
